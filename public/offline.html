<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0F1115" />
  <title>Offline – Ikou</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      background: #0F1115;
      color: #f5f6f8;
      font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      -webkit-font-smoothing: antialiased;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
      gap: 0.75rem;
    }
    .mark {
      width: 2.5rem;
      height: 2.5rem;
      display: grid;
      place-items: center;
      border-radius: 0.625rem;
      background: rgba(85, 102, 232, 0.12);
      border: 1px solid rgba(85, 102, 232, 0.3);
      color: #7d8bee;
      font-size: 1.125rem;
      font-family: 'Hiragino Sans', 'Yu Gothic UI', 'Noto Sans JP', sans-serif;
      margin-bottom: 0.5rem;
    }
    h1 { font-size: 1.125rem; font-weight: 600; letter-spacing: -0.02em; }
    p { font-size: 0.8125rem; color: #9aa0ae; max-width: 19rem; line-height: 1.65; }
    button {
      margin-top: 0.75rem;
      height: 2.5rem;
      padding: 0 1.25rem;
      background: #5566e8;
      color: #fff;
      border: none;
      border-radius: 0.5rem;
      font-family: inherit;
      font-size: 0.875rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s ease;
    }
    button:hover { background: #6d7bec; }
  </style>
</head>
<body>
  <div class="mark">行</div>
  <h1>You're offline</h1>
  <p>Check your connection and try again. Lessons you've already loaded are still available.</p>
  <button onclick="window.location.reload()">Try again</button>
</body>
</html>
